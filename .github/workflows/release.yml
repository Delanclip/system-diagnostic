name: Release diagnostic tools

# Publishes every Windows diagnostic tool as assets of one GitHub Release.
# Keeping all assets in every release preserves permanent
# releases/latest/download/<asset> links as new tools are added.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag and release, for example v1.1.0"
        required: true
        type: string
      title:
        description: "Release title"
        required: true
        default: Delanclip Diagnostic Tools
        type: string
  push:
    branches:
      - main
    paths:
      - .github/release-request.txt

permissions:
  contents: write
  statuses: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            title="${{ inputs.title }}"
          else
            request=".github/release-request.txt"
            test -f "$request" || { echo "::error::$request is missing"; exit 1; }
            version="$(sed -n 's/^version=//p' "$request" | head -n 1 | tr -d '\r')"
            title="$(sed -n 's/^title=//p' "$request" | head -n 1 | tr -d '\r')"
          fi

          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid release version: $version"
            exit 1
          }
          test -n "$title" || { echo "::error::Release title is empty"; exit 1; }

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Assemble all Windows tool assets
        id: build
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=()
          tool_count=0

          for dir in windows/*/; do
            test -d "$dir" || continue
            scripts=("$dir"*.cmd)
            if [ "${#scripts[@]}" -eq 0 ]; then
              continue
            fi

            tool_count=$((tool_count + 1))
            test "${#scripts[@]}" -eq 1 || {
              echo "::error::Expected exactly one .cmd in $dir, found ${#scripts[@]}"
              exit 1
            }

            script_path="${scripts[0]}"
            script=$(basename "$script_path")
            readme="${dir}README.txt"
            test -f "$readme" || { echo "::error::$readme is missing"; exit 1; }

            for f in "$script_path" "$readme"; do
              grep -q $'\r' "$f" || {
                echo "::error::$f is not CRLF"
                exit 1
              }
            done

            asset="${script%.cmd}.zip"
            test ! -e "$asset" || { echo "::error::Duplicate asset name: $asset"; exit 1; }

            (
              cd "$dir"
              zip -qX "$GITHUB_WORKSPACE/$asset" "$script" README.txt
            )

            assets+=("$asset")
            echo "Built $asset from $dir at ${{ github.sha }}"
            unzip -l "$asset"
          done

          test "$tool_count" -gt 0 || {
            echo "::error::No Windows diagnostic tools were found"
            exit 1
          }

          printf '%s\n' "${assets[@]}" > release-assets.txt
          echo "count=${#assets[@]}" >> "$GITHUB_OUTPUT"

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.title }}
        run: |
          set -euo pipefail

          mapfile -t assets < release-assets.txt
          test "${#assets[@]}" -gt 0

          {
            echo "This release contains all currently published Delanclip Windows diagnostic tools."
            echo
            echo "Each tool runs entirely on the customer's machine. It makes no network connections,"
            echo "sends nothing anywhere, and downloads no further code. Reports remain local until"
            echo "the customer chooses to send them to Delanclip Support."
            echo
            echo "Assets:"
            for asset in "${assets[@]}"; do
              echo "- \`$asset\`"
            done
            echo
            echo "Built from \`${{ github.sha }}\`."
          } > notes.md

          gh release create "$RELEASE_VERSION" "${assets[@]}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE $RELEASE_VERSION" \
            --notes-file notes.md

          gh api --method POST \
            "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context='delanclip/release' \
            -f description="Published $RELEASE_VERSION"

          echo "Permanent latest-release links:"
          for asset in "${assets[@]}"; do
            echo "https://github.com/${{ github.repository }}/releases/latest/download/$asset"
          done
